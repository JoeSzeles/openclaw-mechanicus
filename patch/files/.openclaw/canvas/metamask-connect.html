<!DOCTYPE html><html><head><title>OpenClaw MetaMask Connect</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{font-family:sans-serif;background:#f0f0f0;text-align:center;padding:50px;margin:0;}h1{font-size:2.5em;color:#333;}button{padding:15px 30px;font-size:20px;background:#4CAF50;color:white;border:none;border-radius:10px;cursor:pointer;}button:hover{background:#45a049;}button:disabled{background:#ccc;cursor:not-allowed;}#status{font-size:18px;margin-top:20px;color:#666;}</style></head><body><h1>🖖 OpenClaw MetaMask Connect</h1><p>Click to connect your wallet.</p><button id="connect-wallet">Connect MetaMask</button><div id="status"></div><script>(async function(){const button=document.getElementById('connect-wallet');const status=document.getElementById('status');button.onclick=async()=>{button.disabled=true;button.textContent='Connecting...';if(typeof window.ethereum!=='undefined'){try{const accounts=await window.ethereum.request({method:'eth_requestAccounts'});status.innerHTML=`Connected: ${accounts[0].slice(0,6)}...${accounts[0].slice(-4)}`;button.textContent='Connected!';button.style.background='#4CAF50';}catch(error){status.innerHTML=`Error: ${error.message}`;button.textContent='Retry';}}else{status.innerHTML='MetaMask not detected. Install/refresh extension.';button.textContent='Retry';}button.disabled=false;};})();</script></body></html>
