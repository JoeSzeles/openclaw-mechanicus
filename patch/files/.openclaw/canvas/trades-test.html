<!DOCTYPE html>
<html>
<head>
    <title>Trades Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #0d1117; color: #c9d1d9; padding-top: 50px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #30363d; padding: 8px; text-align: left; }
        th { background-color: #161b22; color: #8b949e; }
        h1 { color: #58a6ff; }
        h2 { color: #8b949e; }
        .green { color: #2dc653; }
        .red { color: #f85149; }
    </style>
</head>
<body>
    <h1>Our Trades Dashboard - Test Output</h1>
    <p>Generated by CEO Clelix for Lord Mechanicus. Canvas output tested successfully.</p>

    <h2>Sample Recent Trades (IG Style)</h2>
    <table>
        <tr><th>Instrument</th><th>Action</th><th>Entry Price</th><th>Size</th><th>P&L</th></tr>
        <tr><td>EUR/USD</td><td>Buy</td><td>1.0850</td><td>100k</td><td class="green">+€250</td></tr>
        <tr><td>GBP/USD</td><td>Sell</td><td>1.2650</td><td>50k</td><td class="red">-£120</td></tr>
        <tr><td>BTC/USD</td><td>Buy</td><td>62000</td><td>0.1</td><td class="green">+$500</td></tr>
        <tr><td>SOL/USD</td><td>Sell</td><td>180</td><td>100</td><td class="green">+$300</td></tr>
    </table>

    <h2>P&L Chart</h2>
    <canvas id="pnlChart" width="800" height="400"></canvas>

    <script>
        const ctx = document.getElementById('pnlChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['EUR/USD', 'GBP/USD', 'BTC/USD', 'SOL/USD'],
                datasets: [{
                    label: 'P&L',
                    data: [250, -120, 500, 300],
                    backgroundColor: ['#2dc653', '#f85149', '#2dc653', '#2dc653']
                }]
            },
            options: {
                plugins: { legend: { labels: { color: '#8b949e' } } },
                scales: {
                    x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#8b949e', callback: function(value) { return '$' + value; } },
                        grid: { color: '#21262d' }
                    }
                }
            }
        });
    </script>
</body>
</html>
